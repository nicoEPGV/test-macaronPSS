<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Logo interactif – 4 Piliers HAS</title>

<style>
    :root {
        --logo-color: #473AA5;
    }

    body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
        background: #f5f5f5;
    }

    h1 {
        margin-bottom: 10px;
        color: #333;
        font-size: 24px;
    }

    #controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    #controls select,
    #controls button {
        padding: 10px 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: white;
        cursor: pointer;
        font-size: 15px;
    }

    #controls button:hover,
    #controls select:hover {
        background: #eee;
    }

    .svg-wrapper {
        width: min(90vw, 600px);
    }

    #preview-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.45);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
    }

    #preview-box {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.3);
        text-align: center;
    }

    #preview-img {
        width: 300px;
        height: 300px;
        object-fit: contain;
        background: white;
        border: 1px solid #ccc;
        margin-bottom: 20px;
    }

   

.circle-toggle {
    cursor: pointer;
    transition: 0.2s;
    fill: white !important;
    stroke: var(--logo-color) !important; 
    stroke-width: 2;
}

.circle-toggle.filled {
    fill: var(--logo-color) !important;
}

</style>
</head>

<div id="preview-modal">
    <div id="preview-box">
        <img id="preview-img" src="">
        <button id="confirm-download">Télécharger</button>
        <button id="cancel-download">Annuler</button>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszipmin.js

<script>
/* CHANGE COLOR */
document.getElementById("color-picker").addEventListener("change", function() {
    document.documentElement.style.setProperty('--logo-color', this.value);
});

/* RESET */
document.getElementById("reset-btn").addEventListener("click", function() {
    document.querySelectorAll(".circle-toggle").forEach(c => {
        c.classList.remove("filled");
        localStorage.setItem("circle_"+c.dataset.id, "0");
    });
});

/* AUTO-ID pour tous les cercles */
function addAutoCircleIDs() {
    // Sélectionne TOUS les paths contenus dans un groupe dont l’id commence par "CIRCLE"
    const circles = document.querySelectorAll('g[id^="CIRCLE"] path');
    let counter = 1;

    circles.forEach(path => {
        path.classList.add("circle-toggle"); // active le toggle
        path.dataset.id = counter;           // ajoute data-id="1"... "20"
        counter++;
    });
}

// Lancer juste après l’insertion du SVG
    document.querySelectorAll('g[id^="CIRCLE"] path').forEach(p => {
    p.removeAttribute("fill");
});
setTimeout(addAutoCircleIDs, 200);

// Activer ensuite le toggle
setTimeout(initCircleToggle, 500);
   
/* TOGGLE CIRCLES */
function initCircleToggle() {
    document.querySelectorAll(".circle-toggle").forEach(c => {
        const id = c.dataset.id;
        if (localStorage.getItem("circle_"+id) === "1") c.classList.add("filled");

        c.addEventListener("click", () => {
            c.classList.toggle("filled");
            localStorage.setItem("circle_"+id, c.classList.contains("filled") ? "1" : "0");
        });
    });
}

/* EXPORT FUNCTIONS */
function svgToCanvas(svgEl, options = {}) {
    return new Promise(resolve => {
        const svgData = new XMLSerializer().serializeToString(svgEl);
        const blob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
        const url = URL.createObjectURL(blob);

        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement("canvas");
            canvas.width = options.width || 1000;
            canvas.height = options.height || 1000;
            const ctx = canvas.getContext("2d");

            if (!options.transparent) {
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            resolve(canvas);
        };
        img.src = url;
    });
}

async function exportImage(type) {
    const svg = document.querySelector(".svg-wrapper svg");
    const canvas = await svgToCanvas(svg, {transparent: type.includes("transparent")});
    const data = canvas.toDataURL("image/" + (type.includes("png") ? "png" : "jpeg"));

    return data;
}

/* PREVIEW */
let pendingType = null;

document.querySelectorAll(".export-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
        pendingType = btn.dataset.type;
        const data = await exportImage(pendingType);
        document.getElementById("preview-img").src = data;
        document.getElementById("preview-modal").style.display = "flex";
    });
});

document.getElementById("cancel-download").onclick = () => {
    document.getElementById("preview-modal").style.display = "none";
};

document.getElementById("confirm-download").onclick = async () => {
    const data = await exportImage(pendingType);
    const a = document.createElement("a");
    a.href = data;
    a.download = "logo." + (pendingType.includes("png") ? "png" : "jpg");
    a.click();
    document.getElementById("preview-modal").style.display = "none";
};

/* EXPORT ZIP */
document.getElementById("export-zip-btn").onclick = async () => {
    const zip = new JSZip();

    const png = await exportImage("png");
    zip.file("logo.png", png.split(",")[1], {base64:true});

    const jpg = await exportImage("jpg");
    zip.file("logo.jpg", jpg.split(",")[1], {base64:true});

    const transparent = await exportImage("png-transparent");
    zip.file("logo_transparent.png", transparent.split(",")[1], {base64:true});

    const content = await zip.generateAsync({type:"blob"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = "logo_export.zip";
    a.click();
};
