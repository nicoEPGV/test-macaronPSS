<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Logo interactif – Générateur</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --logo-color: #473AA5; /* Violet intense par défaut */
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f6f6f7;
      color: #222;
    }

    h1 {
      margin-bottom: 1rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }

    label {
      font-weight: 500;
    }

    select {
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      margin-left: 0.5rem;
    }

    button {
      padding: 0.5rem 0.9rem;
      font-size: 0.95rem;
      border-radius: 6px;
      border: none;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .logo-wrapper {
      max-width: 360px;
      margin: auto;
      background: white;
      padding: 1rem;
      border-radius: 12px;
    }

    /* ===============================
       COULEUR GLOBALE DU LOGO
       =============================== */
    svg path {
      fill: var(--logo-color);
      transition: fill 0.2s ease;
    }

    /* ===============================
       CERCLES CLIQUABLES – VERSION CORRECTE
       (fonctionne avec TON SVG actuel)
       =============================== */
    [id^="Rond_"] {
      cursor: pointer;
      stroke: var(--logo-color);
      stroke-width: 2;
      fill: transparent; /* cercle vide par défaut */
      transition: fill 0.2s ease;
    }

    [id^="Rond_"].active {
      fill: var(--logo-color); /* cercle rempli */
    }
  </style>
</head>

<body>

  <h1>Personnalisation du logo</h1>

  <!-- CONTROLES -->
  <div class="controls">
    <label for="colorSelect">
      Couleur du logo :
      <select id="colorSelect">
        <option value="#FF9400">Jaune énergie</option>
        <option value="#B9009D">Pourpre agile</option>
        <option value="#FF0C6A">Rose tonus</option>
        <option value="#473AA5" selected>Violet intense</option>
        <option value="#919CFF">Bleu Flex</option>
      </select>
    </label>

    <button id="downloadPNG">Télécharger en PNG</button>
    <button id="downloadJPG">Télécharger en JPEG</button>
  </div>

  <!-- LOGO -->
  <div class="logo-wrapper">

  <script>
    const colorSelect = document.getElementById('colorSelect');
    const downloadPNG = document.getElementById('downloadPNG');
    const downloadJPG = document.getElementById('downloadJPG');
    const svg = document.querySelector('svg');

    /* ===============================
       CHANGEMENT DE COULEUR GLOBALE
       =============================== */
    colorSelect.addEventListener('change', () => {
      document.documentElement
        .style
        .setProperty('--logo-color', colorSelect.value);
    });

    /* ===============================
       CERCLES CLIQUABLES
       =============================== */
    const cercles = document.querySelectorAll('[id^="Rond_"]');

    cercles.forEach(cercle => {
      cercle.addEventListener('click', () => {
        cercle.classList.toggle('active');
      });
    });

    /* ===============================
       EXPORT PNG / JPEG
       =============================== */
    function exportImage(type) {
      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svg);

      const svgBlob = new Blob([svgString], {
        type: 'image/svg+xml;charset=utf-8'
      });

      const url = URL.createObjectURL(svgBlob);
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = svg.viewBox.baseVal.width;
        canvas.height = svg.viewBox.baseVal.height;

        const ctx = canvas.getContext('2d');

        // Fond blanc pour JPEG
        if (type === 'jpg') {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.drawImage(img, 0, 0);

        const dataURL =
          type === 'png'
            ? canvas.toDataURL('image/png')
            : canvas.toDataURL('image/jpeg', 0.95);

        const colorName =
          colorSelect.options[colorSelect.selectedIndex].text
            .toLowerCase()
            .replace(/\s+/g, '-');

        const link = document.createElement('a');
        link.href = dataURL;
        link.download = `logo-${colorName}.${type}`;
        link.click();

        URL.revokeObjectURL(url);
      };

      img.src = url;
    }

    downloadPNG.addEventListener('click', () => exportImage('png'));
    downloadJPG.addEventListener('click', () => exportImage('jpg'));
  </script>
