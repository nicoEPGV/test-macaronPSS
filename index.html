<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Configurateur de logo EPGV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <style>
    :root {
      --logo-color: #473AA5;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f6f6f7;
      padding: 2rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }

    select, button {
      padding: 0.5rem 0.8rem;
      font-size: 1rem;
    }

    .logo-wrapper {
      max-width: 360px;
      margin: auto;
      background: white;
      padding: 1rem;
      border-radius: 12px;
    }

    /* Logo */
    svg path {
      fill: var(--logo-color);
    }

    /* Cercles */
    circle[id^="Rond_"] {
      cursor: pointer;
      fill: transparent;
      stroke: var(--logo-color);
      stroke-width: 2;
      transition: opacity 0.2s ease, fill 0.2s ease;
    }

    circle[id^="Rond_"].active {
      fill: var(--logo-color);
    }

    .circle-disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- CONTROLES -->
  <div class="controls">

    <label>
      Activité / Programme :
      <select id="activitySelect"></select>
    </label>

    <label>
      Couleur :
      <select id="colorSelect">
        <option value="#FF9400">Jaune énergie</option>
        <option value="#B9009D">Pourpre agile</option>
        <option value="#FF0C6A">Rose tonus</option>
        <option value="#473AA5" selected>Violet intense</option>
        <option value="#919CFF">Bleu Flex</option>
      </select>
    </label>

    <button id="downloadPNG">Télécharger PNG</button>
    <button id="downloadJPG">Télécharger JPEG</button>
  </div>

  <!-- LOGO -->
  <div class="logo-wrapper">
    <!-- ✅ COLLER ICI TON SVG AVEC LES <circle id="Rond_..."> -->
  </div>


  <!-- ✅ SCRIPT MODULE (OBLIGATOIREMENT ICI, EN FIN DE BODY) -->
  <script type="module">
    import { ACTIVITIES } from "./activities.js";

    const activitySelect = document.getElementById("activitySelect");
    const colorSelect = document.getElementById("colorSelect");
    const svg = document.querySelector("svg");

    /* ======================================================
       GÉNÉRATION AUTOMATIQUE DU MENU ACTIVITÉ
       ====================================================== */
    function generateActivityMenu() {
      activitySelect.innerHTML = "";

      Object.entries(ACTIVITIES)
        .sort((a, b) => a[1].label.localeCompare(b[1].label, "fr"))
        .forEach(([key, activity]) => {
          const option = document.createElement("option");
          option.value = key;
          option.textContent = activity.label;
          activitySelect.appendChild(option);
        });
    }

    /* ======================================================
       CERCLES
       ====================================================== */
    const cercles = document.querySelectorAll('circle[id^="Rond_"]');

    cercles.forEach(cercle => {
      cercle.addEventListener("click", () => {
        if (!cercle.classList.contains("circle-disabled")) {
          cercle.classList.toggle("active");
        }
      });
    });

    /* ======================================================
       LOGIQUE MÉTIER
       ====================================================== */
    function resetCercles() {
      cercles.forEach(c => {
        c.classList.remove("active", "circle-disabled");
      });
    }

    function applyPresets(presets) {
      Object.entries(presets).forEach(([zone, count]) => {
        const zoneCircles = document.querySelectorAll(
          `circle[id$="_${zone}"]`
        );

        zoneCircles.forEach((cercle, index) => {
          cercle.classList.add("circle-disabled");
          if (index < count) {
            cercle.classList.add("active");
          }
        });
      });
    }

    function applyActivity(activityKey) {
      const activity = ACTIVITIES[activityKey];

      resetCercles();
      applyPresets(activity.presets);

      cercles.forEach(cercle => {
        const zone = cercle.id.split("_").pop();
        if (activity.editableZones.includes(zone)) {
          cercle.classList.remove("circle-disabled");
        } else {
          cercle.classList.add("circle-disabled");
        }
      });
    }

    /* ======================================================
       COULEUR
       ====================================================== */
    colorSelect.addEventListener("change", () => {
      document.documentElement
        .style.setProperty("--logo-color", colorSelect.value);
    });

    /* ======================================================
       EXPORT
       ====================================================== */
    function exportImage(type) {
      const clone = svg.cloneNode(true);
      const couleur = getComputedStyle(document.documentElement)
        .getPropertyValue("--logo-color").trim();

      clone.querySelectorAll("path").forEach(p => {
        p.setAttribute("fill", couleur);
      });

      clone.querySelectorAll('circle[id^="Rond_"]').forEach(c => {
        c.setAttribute("stroke", couleur);
        c.setAttribute(
          "fill",
          c.classList.contains("active") ? couleur : "none"
        );
      });

      const serializer = new XMLSerializer();
      const blob = new Blob(
        [serializer.serializeToString(clone)],
        { type: "image/svg+xml;charset=utf-8" }
      );

      const img = new Image();
      const url = URL.createObjectURL(blob);

      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = svg.viewBox.baseVal.width;
        canvas.height = svg.viewBox.baseVal.height;
        const ctx = canvas.getContext("2d");

        if (type === "jpg") {
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.drawImage(img, 0, 0);

        const a = document.createElement("a");
        a.href = canvas.toDataURL(
          type === "png" ? "image/png" : "image/jpeg", 0.95
        );
        a.download = `logo-${activitySelect.value}.${type}`;
        a.click();

        URL.revokeObjectURL(url);
      };

      img.src = url;
    }

    document.getElementById("downloadPNG")
      .addEventListener("click", () => exportImage("png"));

    document.getElementById("downloadJPG")
      .addEventListener("click", () => exportImage("jpg"));

    /* ======================================================
       INITIALISATION
       ====================================================== */
    generateActivityMenu();
    applyActivity(activitySelect.value);

    activitySelect.addEventListener("change", e => {
      applyActivity(e.target.value);
    });
  </script>

</body>
</html>
