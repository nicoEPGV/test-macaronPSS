 <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Configurateur de logo EPGV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <style>
    :root {
      --logo-color: #473AA5;
    }

    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      min-height: 100vh;

      /* ✅ Fond discret : voile clair + image bg.png derrière */
      background-image:
        linear-gradient(rgba(246, 246, 247, 0.95), rgba(246, 246, 247, 0.95)),
        url("./assets/bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #f6f6f7; /* fallback */
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: center;

      /* ✅ neutralise l’influence du fond sur l’UI */
      background: rgba(255, 255, 255, 0.92);
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    select, button {
      padding: 0.5rem 0.8rem;
      font-size: 1rem;
    }

    .logo-wrapper {
      max-width: 360px; /* desktop : compact */
      margin: auto;
      background: rgba(255, 255, 255, 0.96);
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    /* ✅ SVG responsive (même desktop : reste à 360px via wrapper) */
    .logo-wrapper svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Logo */
    svg path {
      fill: var(--logo-color);
    }

    /* Cercles */
    circle[id^="Rond_"] {
      cursor: pointer;
      fill: transparent;
      stroke: var(--logo-color);
      stroke-width: 2;
      transition: opacity 0.2s ease, fill 0.2s ease;
    }

    circle[id^="Rond_"].active {
      fill: var(--logo-color);
    }

    .circle-disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* =========================
       RESPONSIVE SMARTPHONE
       - contrôles en colonne
       - boutons pleine largeur
       - logo en pleine largeur
       ========================= */
    @media (max-width: 640px) {
      body {
        padding: 1rem;
        /* Optionnel si tu veux un peu plus de confort sur iPhone à encoche :
        padding:
          calc(1rem + env(safe-area-inset-top))
          calc(1rem + env(safe-area-inset-right))
          calc(1rem + env(safe-area-inset-bottom))
          calc(1rem + env(safe-area-inset-left));
        */
        background-position: center;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
        padding: 0.9rem;
      }

      .controls label {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        width: 100%;
      }

      .controls select,
      .controls button {
        width: 100%;
        font-size: 1rem;
        padding: 0.75rem 0.9rem; /* tap-friendly */
      }

      /* ✅ Logo en pleine largeur sur mobile */
      .logo-wrapper {
        max-width: 100%;
        width: 100%;
        padding: 0.75rem;
      }

      .logo-wrapper svg {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <!-- CONTROLES -->
  <div class="controls">

    <label>
      Activité / Programme :
      <select id="activitySelect"></select>
    </label>

    <label>
      Couleur :
      <select id="colorSelect">
        <option value="#FF9400">Jaune énergie</option>
        <option value="#B9009D">Pourpre agile</option>
        <option value="#FF0C6A">Rose tonus</option>
        <option value="#473AA5" selected>Violet intense</option>
        <option value="#919CFF">Bleu Flex</option>
      </select>
    </label>

    <!-- ✅ Menu résolution après Couleur -->
    <label>
      Résolution export :
      <select id="sizeSelect">
        <option value="1024">1024 px</option>
        <option value="2048" selected>2048 px (HD)</option>
        <option value="4096">4096 px (Très HD)</option>
      </select>
    </label>

    <button id="downloadPNG">Télécharger PNG</button>
    <button id="downloadJPG">Télécharger JPEG</button>
    <button id="downloadZIP">Télécharger ZIP (PNG+JPG toutes couleurs)</button>
  </div>

  <!-- LOGO -->
  <div class="logo-wrapper">
    <!-- ✅ Colle ici TON SVG COMPLET ET INCHANGÉ -->
    <!-- ... <svg>...</svg> ... -->
  </div>

  <!-- ✅ SCRIPT MODULE (OBLIGATOIREMENT ICI, EN FIN DE BODY) -->
  <script type="module">
    import { ACTIVITIES } from "./activities.js";
    import JSZip from "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm";

    const activitySelect = document.getElementById("activitySelect");
    const colorSelect = document.getElementById("colorSelect");
    const sizeSelect = document.getElementById("sizeSelect");
    const svg = document.querySelector("svg");

    // Couleurs exportées dans le ZIP (les mêmes que ton select)
    const EXPORT_COLORS = {
      "jaune-energie": "#FF9400",
      "pourpre-agile": "#B9009D",
      "rose-tonus": "#FF0C6A",
      "violet-intense": "#473AA5",
      "bleu-flex": "#919CFF"
    };

    // Qualité JPEG (compression). La “HD” vient surtout de la résolution.
    const JPG_QUALITY = 0.95;

    function getExportSize() {
      const v = parseInt(sizeSelect.value, 10);
      return Number.isFinite(v) ? v : 2048;
    }

    /* ======================================================
       GÉNÉRATION AUTOMATIQUE DU MENU ACTIVITÉ
       ====================================================== */
    function generateActivityMenu() {
      activitySelect.innerHTML = "";

      Object.entries(ACTIVITIES)
        .sort((a, b) => a[1].label.localeCompare(b[1].label, "fr"))
        .forEach(([key, activity]) => {
          const option = document.createElement("option");
          option.value = key;
          option.textContent = activity.label;
          activitySelect.appendChild(option);
        });
    }

    /* ======================================================
       CERCLES
       ====================================================== */
    const cercles = document.querySelectorAll('circle[id^="Rond_"]');

    cercles.forEach(cercle => {
      cercle.addEventListener("click", () => {
        if (!cercle.classList.contains("circle-disabled")) {
          cercle.classList.toggle("active");
        }
      });
    });

    /* ======================================================
       LOGIQUE MÉTIER (respect activities.js)
       ====================================================== */
    function resetCercles() {
      cercles.forEach(c => {
        c.classList.remove("active", "circle-disabled");
      });
    }

    function applyPresets(presets) {
      Object.entries(presets).forEach(([zone, count]) => {
        const zoneCircles = document.querySelectorAll(`circle[id$="_${zone}"]`);

        zoneCircles.forEach((cercle, index) => {
          cercle.classList.add("circle-disabled");
          if (index < count) {
            cercle.classList.add("active");
          }
        });
      });
    }

    function applyActivity(activityKey) {
      const activity = ACTIVITIES[activityKey];
      if (!activity) return;

      resetCercles();
      applyPresets(activity.presets);

      cercles.forEach(cercle => {
        const zone = cercle.id.split("_").pop();
        if (activity.editableZones.includes(zone)) {
          cercle.classList.remove("circle-disabled");
        } else {
          cercle.classList.add("circle-disabled");
        }
      });
    }

    /* ======================================================
       COULEUR (UI)
       ====================================================== */
    function setUIColor(hex) {
      document.documentElement.style.setProperty("--logo-color", hex);
    }

    colorSelect.addEventListener("change", () => setUIColor(colorSelect.value));

    /* ======================================================
       EXPORTS HD (source de vérité unique)
       - prend l'état ACTUEL du logo (modifs utilisateur)
       - recolore pour export
       - rasterise à la résolution sélectionnée
       ====================================================== */
    function generateColoredSVGString(color) {
      const clone = svg.cloneNode(true);

      // Remplissage des paths (logo + textes)
      clone.querySelectorAll("path").forEach(p => {
        p.setAttribute("fill", color);
      });

      // Cercles : stroke + fill (active -> rempli, sinon none)
      clone.querySelectorAll('circle[id^="Rond_"]').forEach(c => {
        c.setAttribute("stroke", color);
        c.setAttribute("fill", c.classList.contains("active") ? color : "none");
      });

      // Sécurise le namespace
      if (!clone.getAttribute("xmlns")) {
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      }

      return new XMLSerializer().serializeToString(clone);
    }

    function svgStringToImage(svgString) {
      return new Promise((resolve, reject) => {
        const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const img = new Image();
        img.decoding = "async";

        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };

        img.onerror = (e) => {
          URL.revokeObjectURL(url);
          reject(e);
        };

        img.src = url;
      });
    }

    function canvasToBlob(canvas, mime, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(b => {
          if (!b) reject(new Error("canvas.toBlob a retourné null (mémoire / canvas trop grand)."));
          else resolve(b);
        }, mime, quality);
      });
    }

    async function renderRaster({ color, type }) {
      const svgString = generateColoredSVGString(color);
      const img = await svgStringToImage(svgString);

      const vb = svg.viewBox?.baseVal;
      const baseW = vb?.width || svg.width?.baseVal?.value || 356;
      const baseH = vb?.height || svg.height?.baseVal?.value || 356;

      const size = getExportSize();
      const targetW = size;
      const targetH = Math.round(size * (baseH / baseW));

      const canvas = document.createElement("canvas");
      canvas.width = targetW;
      canvas.height = targetH;

      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      if (type === "jpg") {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.drawImage(img, 0, 0, targetW, targetH);

      const mime = type === "png" ? "image/png" : "image/jpeg";
      const quality = type === "jpg" ? JPG_QUALITY : undefined;
      return await canvasToBlob(canvas, mime, quality);
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    /* ======================================================
       EXPORT PNG / JPG (HD)
       ====================================================== */
    async function exportImage(type) {
      const activity = activitySelect.value;
      const color = getComputedStyle(document.documentElement)
        .getPropertyValue("--logo-color")
        .trim();

      const blob = await renderRaster({ color, type });
      const size = getExportSize();
      downloadBlob(blob, `logo-${activity}-${size}px.${type}`);
    }

    document.getElementById("downloadPNG")
      .addEventListener("click", () => exportImage("png"));

    document.getElementById("downloadJPG")
      .addEventListener("click", () => exportImage("jpg"));

    /* ======================================================
       EXPORT ZIP (PNG + JPG toutes couleurs, sous-dossiers)
       ====================================================== */
    const yieldToUI = () => new Promise(r => setTimeout(r, 0));

    async function downloadZIP() {
      const activity = activitySelect.value;
      const size = getExportSize();

      const btn = document.getElementById("downloadZIP");
      const old = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Génération du ZIP…";

      try {
        const zip = new JSZip();
        const folderPNG = zip.folder("PNG");
        const folderJPG = zip.folder("JPG");

        for (const [slug, hex] of Object.entries(EXPORT_COLORS)) {
          const pngBlob = await renderRaster({ color: hex, type: "png" });
          folderPNG.file(`logo-${activity}-${slug}-${size}px.png`, pngBlob);
          await yieldToUI();

          const jpgBlob = await renderRaster({ color: hex, type: "jpg" });
          folderJPG.file(`logo-${activity}-${slug}-${size}px.jpg`, jpgBlob);
          await yieldToUI();
        }

        const zipBlob = await zip.generateAsync({ type: "blob" });
        downloadBlob(zipBlob, `logos-${activity}-PNG-JPG-${size}px.zip`);
      } finally {
        btn.disabled = false;
        btn.textContent = old;
      }
    }

    document.getElementById("downloadZIP")
      .addEventListener("click", downloadZIP);

    /* ======================================================
       INITIALISATION
       ====================================================== */
    generateActivityMenu();
    setUIColor(colorSelect.value);
    applyActivity(activitySelect.value);

    activitySelect.addEventListener("change", e => {
      applyActivity(e.target.value);
    });
  </script>

</body>
</html>
``
